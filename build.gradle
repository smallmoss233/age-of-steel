plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}

	// ModMenu
	maven { url "https://maven.terraformersmc.com/releases/" }

	// YACL
	maven { url 'https://maven.isxander.dev/releases' }

	maven {
		name = "AmbleKit"
		url = "https://amblelabs.dev/maven/"
		content {
			includeGroup "dev.amblelabs"
		}
	}

	mavenCentral()

	// JEI
	maven { url "https://maven.blamejared.com/" }

	maven {
		url "https://theo.is-a.dev/maven/"
		content {
			includeGroup "dev.drtheo"
		}
	}

	maven {
		url "https://maven.shedaniel.me/"
	}

	maven {
		url = "https://jitpack.io/"
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

	//amblekit
	modApi("com.github.amblelabs:modkit:${project.amblekit_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	modRuntimeOnly("maven.modrinth:jei:${project.jei_version}")

	modImplementation("mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}")

	// ait
	modImplementation "dev.amblelabs:ait:${project.ait_version}"
}

sourceSets {
	main {
		resources {
			srcDirs += [
			        "src/main/generated"
			]
		}
	}
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	def version = project.version
	inputs.property "version", version
	inputs.property "amblekit_version", project.amblekit_version

	def expansionVars = [
	        "version": project.version,
			"amblekit_version": project.amblekit_version
	]

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_22
	targetCompatibility = JavaVersion.VERSION_17
}

sourcesJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
